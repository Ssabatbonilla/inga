# ---- Customize me. Sourced by sync.sh (plain bash). ----

# Folder on your external drive to mirror into the repo.
# macOS: /Volumes/MyDrive/Research   Linux: /media/$USER/MyDrive/Research
# Windows (Git Bash): /d/Research    WSL: /mnt/d/Research
SRC="/Volumes/MyDrive/Research"

# Subfolder inside the repo that receives the mirror (keeps repo root clean).
DEST_SUBDIR="workspace"

# Branch to push to. Cloud sessions pick up whatever is on the default branch
# (or the branch you name when you start a session).
BRANCH="main"

# Size tiers (MB):
#   <= GIT_MAX_MB            -> regular git
#   GIT_MAX_MB..LFS_MAX_MB   -> Git LFS (needs `git lfs install`; else treated as oversize)
#   >  LFS_MAX_MB            -> NOT committed; listed in workspace/OVERSIZE.tsv with sha256
GIT_MAX_MB=20
LFS_MAX_MB=500

# Optional: rclone remote:path for oversize files (e.g. "gdrive:inga-oversize").
# Leave empty to skip. Requires `rclone config` done once on your machine.
RCLONE_REMOTE=""

# rsync exclude patterns (one per line). Edit freely.
EXCLUDES=(
  ".DS_Store" "Thumbs.db" "desktop.ini" "~\$*" ".~lock.*"
  ".Rproj.user/" ".Rhistory" ".RData" ".Ruserdata"
  "renv/library/" "__pycache__/" ".ipynb_checkpoints/"
  ".git/" "*.tmp" "*.log"
  # Sensitive material: never mirror these.
  ".env" "*.pem" "*.key" "*credentials*" "*secret*"
)

# Commit message prefix.
COMMIT_PREFIX="sync"
